{% extends "admin/base_site.html" %}
{% load static %}

{% block branding %}
    <h1 id="site-name">
        <a href="{% url 'admin:index' %}">
            <img src="{% static 'branding/eagle-gold.svg' %}"
                 width="40" height="30" alt="وزارة الأشغال العامة والإسكان"
                 style="vertical-align:middle;margin-inline-end:8px">
            {{ site_header }}
        </a>
    </h1>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <link rel="icon" type="image/svg+xml" href="{% static 'branding/eagle-gold.svg' %}">
    <style>
        form .aligned ul {
            margin-left: 0;
            padding-left: 0;
        }

        .field-workflow_json .readonly {
            white-space: pre-wrap;
            line-height: 1.5;
            font-family: monospace,"Roboto","Lucida Grande","DejaVu Sans","Bitstream Vera Sans",Verdana,Arial,sans-serif;
        }
    </style>
{% endblock %}
