[project]
name = "pneumatic-mcp"
version = "0.1.0"
description = "Isolated Pneumatic MCP resource server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.10.1,<3",
    "starlette>=1.7,<2",
    "redis>=6.2,<8",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneumatic_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
