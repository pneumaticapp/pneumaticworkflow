# LOGS_BACKEND=none: the whole event pipeline is off. emit() writes nothing
# and the consumer tick returns at once, so the collector has nothing to
# receive and is not started. The buffer is db4 of the main Redis and needs
# nothing.
#
# Set LOGS_BACKEND=none together with this file. This file alone, with the
# pipeline still on, means events pile up in the buffer with no collector to
# drain it, until LOGS_STREAM_MAXLEN starts dropping the oldest.
#
#   docker compose -f docker-compose.yml -f logging/compose/logs-none.yml up -d
#
# or, permanently, in .env:
#
#   LOGS_BACKEND=none
#   COMPOSE_FILE=docker-compose.yml:logging/compose/logs-none.yml
#
# `docker compose` interpolates the base file whatever the profiles say, so
# GRAFANA_ADMIN_PASSWORD still has to hold a value even though Grafana never
# starts here. Any string will do - it is never used.
services:
  otel-collector:
    profiles: ["disabled"]

  loki:
    profiles: ["disabled"]

  grafana:
    profiles: ["disabled"]
