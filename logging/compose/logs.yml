# The logging stack: the collector, Loki and Grafana.
#
# Included by docker-compose.yml and docker-compose.src.yml so the
# three services are declared once instead of once per root file,
# which is how their two copies used to drift.
#
# Off by default. Every service sits behind a profile named after the
# LOGS_BACKEND it serves, and a service starts only when one of its
# profiles is enabled:
#
#   LOGS_BACKEND=local          --profile logs-local          collector, Loki, Grafana
#   LOGS_BACKEND=otlp           --profile logs-otlp           collector
#   LOGS_BACKEND=elasticsearch  --profile logs-elasticsearch  collector, plus
#                               logging/elasticsearch/docker-compose.collector-elasticsearch.yml
#
# start.sh passes the profile itself; running compose by hand, set
# COMPOSE_PROFILES in .env next to LOGS_BACKEND, see default.env.
#
# The networks and the volumes are named here as well because the
# services below use them; compose merges these declarations with the
# ones of the including file, so they stay the same objects.
#
# The bind mounts are relative to this file, not to the root of the
# repository: compose resolves a relative path of an included file
# against the directory that file lives in.

name: pneumatic

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: pneumatic-otel-collector
    profiles: ["logs-local", "logs-otlp", "logs-elasticsearch"]
    command:
      - --config=/etc/otel/base.yaml
      - --config=/etc/otel/backend-${LOGS_BACKEND:-none}.yaml
    environment:
      LOGS_OTLP_EXPORT_ENDPOINT: ${LOGS_OTLP_EXPORT_ENDPOINT:-}
      LOGS_OTLP_EXPORT_AUTH: ${LOGS_OTLP_EXPORT_AUTH:-}
    volumes:
      - ../otel:/etc/otel:ro
    expose:
      - 4318     # OTLP/HTTP receiver
      - 13133    # health_check extension
    networks:
      - pneumatic
      - pneumatic-logs
    restart: always

  loki:
    image: grafana/loki:3.7.7
    container_name: pneumatic-loki
    profiles: ["logs-local"]
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    environment:
      LOGS_RETENTION_PERIOD: ${LOGS_RETENTION_PERIOD:-365d}
    volumes:
      - ../loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    expose:
      - 3100
    networks:
      - pneumatic-logs
    restart: always

  grafana:
    image: grafana/grafana:12.4.10
    container_name: pneumatic-grafana
    profiles: ["logs-local"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${GRAFANA_HOME_DASHBOARD:-/etc/grafana/provisioning/dashboards/json/project-overview.json}
    # The password is checked here, not with ${GRAFANA_ADMIN_PASSWORD:?}:
    # compose interpolates every service whatever its profile, so a required
    # variable would stop the installations that never start Grafana. An
    # empty value would not fail on its own either - Grafana falls back to
    # admin/admin.
    entrypoint:
      - sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh'
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - pneumatic-logs
    restart: always

networks:
  pneumatic:
  pneumatic-logs:

volumes:
  loki-data:
  grafana-data:
