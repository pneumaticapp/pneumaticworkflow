        # The optional MCP container is resolved at request time so nginx
        # also starts when the mcp Compose profile is disabled.
        location = /mcp {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mcp_upstream http://pneumatic-mcp:8000;
            proxy_pass $mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            client_max_body_size 1m;
            add_header Cache-Control no-store always;
            proxy_intercept_errors on;
            error_page 502 504 =503 @mcp_unavailable;
        }

        location @mcp_unavailable {
            return 503;
        }

        location ^~ /oauth/mcp/ {
            # nginx error messages can echo the original request query.
            error_log /dev/null crit;
            include /etc/nginx/includes/proxy_to_backend.conf;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /.well-known/oauth-authorization-server {
            include /etc/nginx/includes/proxy_to_backend.conf;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            include /etc/nginx/includes/proxy_to_backend.conf;
        }

        location = /.well-known/oauth-protected-resource {
            include /etc/nginx/includes/proxy_to_backend.conf;
        }
