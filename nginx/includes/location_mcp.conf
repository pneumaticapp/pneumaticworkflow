        # RFC 8414 and RFC 9728 discovery stays at the origin root; application routes share /mcp.
        location ~ ^/(?:mcp(?:/|$)|\.well-known/oauth-(?:authorization-server$|protected-resource/mcp$)) {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mcp_upstream http://pneumatic-mcp:3000;
            proxy_pass $mcp_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # The connector throttles consent by IP, so discard client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            client_max_body_size 26m;
            # Upload capability tokens are part of the path.
            access_log off;
        }
