        # Claude connector (MCP server): the endpoint and its OAuth routes,
        # which OAuth clients look up at the root of the origin.
        location = /mcp {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        location = /authorize {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        location = /token {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        location = /register {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        # The path carries a one-time upload token: keep it out of access logs
        location ^~ /upload/ {
            access_log off;
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        location ^~ /.well-known/oauth-protected-resource {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
        location ^~ /.well-known/oauth-authorization-server {
            include /etc/nginx/includes/proxy_to_mcp.conf;
        }
