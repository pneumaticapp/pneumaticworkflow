            # Resolved per request: the connector runs only with the "mcp"
            # compose profile, and nginx must start without it.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mcp_upstream http://pneumatic-mcp:3000;
            proxy_pass $mcp_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP: MCP responses are streamed as server-sent events
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            # Upload links accept files up to 25 MiB
            client_max_body_size 26m;
