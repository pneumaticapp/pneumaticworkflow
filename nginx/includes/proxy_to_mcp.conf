            # Resolved per request: the MCP container is optional, so nginx must start without it.
            resolver 127.0.0.11 valid=10s ipv6=off;
            # No URI path here, otherwise nginx would send it instead of the rewritten URI.
            set $mcp_upstream http://pneumatic-mcp:3000;
            # The connector serves its routes from the root, so strip the /mcp prefix.
            rewrite ^/mcp/(.*) /$1 break;
            proxy_pass $mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            client_max_body_size 26m;
            # Upload capability tokens are part of the path.
            access_log off;

            proxy_buffering off;
            proxy_cache off;
