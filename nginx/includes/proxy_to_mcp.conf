            # Resolved per request so nginx starts without the optional connector
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mcp_upstream http://pneumatic-mcp:3000;
            proxy_pass $mcp_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Drops a client-sent X-Forwarded-For: the connector throttles sign-in attempts per client IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP: MCP responses are streamed as server-sent events
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            client_max_body_size 26m;
