name: Build and push a new stable version

on:
  push:
    tags:
      - 'v*'

jobs:
  validate_mcp:
    name: Validate MCP at the release tag
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    permissions:
      contents: read
    env:
      MCP_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - working-directory: mcp
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Validate release proxy and configuration
        run: |
          docker pull nginx:1.25.4-alpine
          python scripts/tests/test_mcp_nginx.py
          docker compose -f docker-compose.yml --profile mcp config --quiet
          docker compose -f docker-compose.src.yml --profile mcp config --quiet
  push_to_registry:
    needs: validate_mcp
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pneumaticworkflow/pneumatic-frontend
            dockerfile: frontend/Dockerfile
            build_context: frontend
          - image: pneumaticworkflow/pneumatic-backend
            dockerfile: backend/Dockerfile
            build_context: backend
          - image: pneumaticworkflow/pneumatic-celery
            dockerfile: backend/Dockerfile
            build_context: backend
          - image: pneumaticworkflow/pneumatic-celery-beat
            dockerfile: backend/Dockerfile
            build_context: backend
          - image: pneumaticworkflow/pneumatic-file-service
            dockerfile: storage/Dockerfile
            build_context: storage
          - image: pneumaticworkflow/pneumatic-mcp
            dockerfile: mcp/Dockerfile
            build_context: mcp
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "pneumaticworkflow/pneumatic-release-builder"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.build_context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: "${{ steps.meta.outputs.tags }},${{ matrix.image }}:stable"
          labels: ${{ steps.meta.outputs.labels }}
